name: Fabricar App Mi Cuadrante

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar entorno web y Capacitor 6 con AdMob
        run: |
          mkdir -p www
          cp index.html privacidad.html manifest.json sw.js www/ 2>/dev/null || true
          cp icon.svg icon.png icon-192.png icon-512.png icon-maskable-512.png www/ 2>/dev/null || true
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/admob@6

          echo '{"appId":"com.k4nt3r0.micuadrante","appName":"Mi Cuadrante","webDir":"www"}' > capacitor.config.json

          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Generar e inyectar iconos Android (blindado con sharp)
        run: |
          npm install sharp
          cat << 'EOF' > inject-icons.js
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');

          async function run() {
            const src = ['icon.png', 'icon.jpg', 'icon.svg'].find(f => fs.existsSync(f));
            if (!src) return;

            const master = await sharp(src).resize(1024, 1024, { fit: 'cover' }).png().toBuffer();
            const resDir = 'android/app/src/main/res';

            for (const d of ['drawable-anydpi-v24', 'mipmap-anydpi-v26']) {
              const p = path.join(resDir, d);
              if (fs.existsSync(p)) fs.rmSync(p, { recursive: true, force: true });
            }

            const anyDpi = path.join(resDir, 'mipmap-anydpi-v26');
            fs.mkdirSync(anyDpi, { recursive: true });
            const adaptiveXml = '<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>';
            fs.writeFileSync(path.join(anyDpi, 'ic_launcher.xml'), adaptiveXml);
            fs.writeFileSync(path.join(anyDpi, 'ic_launcher_round.xml'), adaptiveXml);

            const valuesDir = path.join(resDir, 'values');
            fs.mkdirSync(valuesDir, { recursive: true });
            fs.writeFileSync(path.join(valuesDir, 'ic_launcher_background.xml'),
              '<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#040B25</color></resources>'
            );

            const mipmaps = [
              { folder: 'mipmap-mdpi', size: 48, fg: 108 },
              { folder: 'mipmap-hdpi', size: 72, fg: 162 },
              { folder: 'mipmap-xhdpi', size: 96, fg: 216 },
              { folder: 'mipmap-xxhdpi', size: 144, fg: 324 },
              { folder: 'mipmap-xxxhdpi', size: 192, fg: 432 }
            ];

            for (const m of mipmaps) {
              const dir = path.join(resDir, m.folder);
              fs.mkdirSync(dir, { recursive: true });
              await sharp(master).resize(m.size, m.size).png().toFile(path.join(dir, 'ic_launcher.png'));
              await sharp(master).resize(m.size, m.size).png().toFile(path.join(dir, 'ic_launcher_round.png'));
              const inner = Math.round(m.fg * 0.72);
              const innerBuf = await sharp(master).resize(inner, inner).png().toBuffer();
              await sharp({ create: { width: m.fg, height: m.fg, channels: 4, background: { r: 4, g: 11, b: 37, alpha: 1 } } })
                .composite([{ input: innerBuf, gravity: 'center' }])
                .png()
                .toFile(path.join(dir, 'ic_launcher_foreground.png'));
            }
          }
          run().catch(e => { console.error(e); process.exit(1); });
          EOF
          node inject-icons.js

      - name: Inyectar AdMob, Permiso AD_ID, SDK 24-36, R8 DEX y VersionCode
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - << 'EOF'
          import os, re

          # 1. AndroidManifest.xml (Permiso AD_ID + Meta-data AdMob)
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r", encoding="utf-8") as f:
                  content = f.read()

              if "com.google.android.gms.permission.AD_ID" not in content:
                  content = content.replace("</manifest>", '    <uses-permission android:name="com.google.android.gms.permission.AD_ID" />\n</manifest>')

              app_id = os.environ.get("ADMOB_APP_ID", "").strip()
              if not app_id or "~" not in app_id:
                  app_id = "ca-app-pub-6672720525194990~3491583985"

              meta_tag = f'<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="{app_id}"/>'
              if "com.google.android.gms.ads.APPLICATION_ID" not in content:
                  content = content.replace("</application>", f'        {meta_tag}\n    </application>')

              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(content)

          # 2. android/variables.gradle (SDK 24-36)
          vars_path = "android/variables.gradle"
          if os.path.exists(vars_path):
              with open(vars_path, "r", encoding="utf-8") as f:
                  v = f.read()
              v = re.sub(r"minSdkVersion[ \t]*=[ \t]*\d+", "minSdkVersion = 24", v)
              v = re.sub(r"compileSdkVersion[ \t]*=[ \t]*\d+", "compileSdkVersion = 36", v)
              v = re.sub(r"targetSdkVersion[ \t]*=[ \t]*\d+", "targetSdkVersion = 36", v)
              with open(vars_path, "w", encoding="utf-8") as f:
                  f.write(v)

          # 3. android/gradle.properties
          prop_path = "android/gradle.properties"
          if os.path.exists(prop_path):
              with open(prop_path, "r", encoding="utf-8") as f:
                  props = f.read()
              if "android.suppressUnsupportedCompileSdk" not in props:
                  with open(prop_path, "a", encoding="utf-8") as f:
                      f.write("\nandroid.suppressUnsupportedCompileSdk=36\n")

          # 4. android/app/build.gradle (VersionCode + activar R8/ofuscacion DEX)
          gradle_path = "android/app/build.gradle"
          if os.path.exists(gradle_path):
              with open(gradle_path, "r", encoding="utf-8") as f:
                  g = f.read()
              run_num = int(os.environ.get("RUN_NUMBER", "1"))
              new_vc = 140 + run_num
              g = re.sub(r"versionCode[ \t]+\d+", f"versionCode {new_vc}", g)
              g = re.sub(r'versionName[ \t]+"[^"]+"', f'versionName "2.1.{run_num}"', g)
              g = g.replace(
                  "minifyEnabled false",
                  "minifyEnabled true\n            shrinkResources true"
              )
              g = g.replace(
                  "getDefaultProguardFile('proguard-android.txt')",
                  "getDefaultProguardFile('proguard-android-optimize.txt')"
              )
              with open(gradle_path, "w", encoding="utf-8") as f:
                  f.write(g)

          # 5. android/app/proguard-rules.pro (Proteger Capacitor 6 + AdMob mientras R8 ofusca el resto)
          proguard_path = "android/app/proguard-rules.pro"
          rules = """
          # Reglas R8 para Capacitor 6 y AdMob
          -keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod
          -keep class com.getcapacitor.annotation.** { *; }
          -keep @com.getcapacitor.annotation.CapacitorPlugin class * {
              <init>(...);
              @com.getcapacitor.annotation.PluginMethod <methods>;
              @com.getcapacitor.annotation.PermissionCallback <methods>;
              @com.getcapacitor.annotation.ActivityCallback <methods>;
          }
          -keep class * extends com.getcapacitor.Plugin {
              <init>(...);
              @com.getcapacitor.annotation.PluginMethod <methods>;
              @com.getcapacitor.annotation.PermissionCallback <methods>;
              @com.getcapacitor.annotation.ActivityCallback <methods>;
          }
          -keepclassmembers class * {
              @android.webkit.JavascriptInterface <methods>;
          }
          -keep class com.k4nt3r0.micuadrante.MainActivity { *; }
          -keep class com.getcapacitor.BridgeActivity { *; }
          -keep class com.getcapacitor.community.admob.** { *; }
          """
          with open(proguard_path, "a", encoding="utf-8") as f:
              f.write("\n" + "\n".join(line.strip() for line in rules.splitlines()) + "\n")
          EOF

      - name: Firmar y compilar AAB y APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew

          KS_PASS="${KEYSTORE_PASSWORD:-MiCuadrante2026!}"
          K_ALIAS="${KEY_ALIAS:-micuadrante}"
          K_PASS="${KEY_PASSWORD:-MiCuadrante2026!}"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d ' \n\r\t' | base64 --decode > app/release.keystore
          else
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias "$K_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$K_PASS" \
              -dname "CN=K4NT3R0, OU=Apps, O=K4NT3R0, L=Cadiz, ST=Andalucia, C=ES"
          fi

          ./gradlew bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/release.keystore \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$K_ALIAS" \
            -Pandroid.injected.signing.key.password="$K_PASS"

      - name: Subir archivo AAB para Google Play
        uses: actions/upload-artifact@v4
        with:
          name: MiCuadrante-AAB
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Subir archivo APK para prueba directa
        uses: actions/upload-artifact@v4
        with:
          name: MiCuadrante-APK
          path: android/app/build/outputs/apk/release/*.apk
