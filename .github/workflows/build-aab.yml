name: Build Signed Android AAB (Mi Cuadrante)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare web assets & Capacitor with AdMob
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js www/ 2>/dev/null || true
          cp icon.svg www/ 2>/dev/null || true
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor-community/admob@6
          if [ ! -f capacitor.config.json ]; then
            echo '{"appId":"com.k4nt3r0.micuadrante","appName":"Mi Cuadrante","webDir":"www"}' > capacitor.config.json
          fi
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure AndroidManifest (AD_ID + AdMob) & VersionCode
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          # Añadir permiso AD_ID obligatorio para Android 13+ en Play Console
          if ! grep -q "com.google.android.gms.permission.AD_ID" "$MANIFEST"; then
            sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="com.google.android.gms.permission.AD_ID" />|' "$MANIFEST"
          fi
          # Añadir APPLICATION_ID de AdMob dentro de <application>
          if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
            ADMOB_APP_ID="${{ secrets.ADMOB_APP_ID }}"
            if [ -z "$ADMOB_APP_ID" ]; then
              ADMOB_APP_ID="ca-app-pub-6672720525194990~3347511713"
            fi
            sed -i "s|</application>|    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="$ADMOB_APP_ID"/>
    </application>|" "$MANIFEST"
          fi
          # Incrementar versionCode automáticamente con el número de ejecución de GitHub
          VC=$((10 + ${{ github.run_number }}))
          sed -i "s/versionCode [0-9]*/versionCode $VC/" android/app/build.gradle
          sed -i 's/versionName ".*"/versionName "1.1.'${{ github.run_number }}'"/' android/app/build.gradle

      - name: Decode Keystore & Sign Release AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-key.keystore
          cd android
          ./gradlew bundleRelease             -Pandroid.injected.signing.store.file=$PWD/app/release-key.keystore             -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD"             -Pandroid.injected.signing.key.alias="$KEY_ALIAS"             -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Upload Signed AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
