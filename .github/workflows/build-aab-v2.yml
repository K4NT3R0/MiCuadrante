name: Fabricar App Mi Cuadrante

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Preparar entorno web y Capacitor 6 con AdMob
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js www/ 2>/dev/null || true
          cp icon.svg icon.png www/ 2>/dev/null || true
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/admob@6

          echo '{"appId":"com.k4nt3r0.micuadrante","appName":"Mi Cuadrante","webDir":"www"}' > capacitor.config.json

          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Inyectar AdMob, Permiso AD_ID, SDK 34 y VersionCode
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - << 'EOF'
          import os, re

          # 1. AndroidManifest.xml (Permiso AD_ID + Meta-data AdMob)
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r", encoding="utf-8") as f:
                  content = f.read()

              if "com.google.android.gms.permission.AD_ID" not in content:
                  content = content.replace("</manifest>", '    <uses-permission android:name="com.google.android.gms.permission.AD_ID" />\n</manifest>')

              app_id = os.environ.get("ADMOB_APP_ID", "").strip()
              if not app_id or "~" not in app_id:
                  app_id = "ca-app-pub-6672720525194990~3347511713"

              meta_tag = f'<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="{app_id}"/>'
              if "com.google.android.gms.ads.APPLICATION_ID" not in content:
                  content = content.replace("</application>", f'        {meta_tag}\n    </application>')

              with open(manifest_path, "w", encoding="utf-8") as f:
                  f.write(content)

          # 2. android/app/build.gradle (SDK 34 + VersionCode automático)
          gradle_path = "android/app/build.gradle"
          if os.path.exists(gradle_path):
              with open(gradle_path, "r", encoding="utf-8") as f:
                  gradle = f.read()

              # Forzar compileSdk y targetSdk a 34 para cumplir política de Google Play
              gradle = re.sub(r"compileSdkVersion\s+\d+", "compileSdkVersion 34", gradle)
              gradle = re.sub(r"compileSdk\s+\d+", "compileSdk 34", gradle)
              gradle = re.sub(r"targetSdkVersion\s+\d+", "targetSdkVersion 34", gradle)
              gradle = re.sub(r"targetSdk\s+\d+", "targetSdk 34", gradle)

              run_num = int(os.environ.get("RUN_NUMBER", "1"))
              new_vc = 50 + run_num
              gradle = re.sub(r"versionCode\s+\d+", f"versionCode {new_vc}", gradle)
              gradle = re.sub(r'versionName\s+"[^"]+"', f'versionName "1.1.{run_num}"', gradle)

              with open(gradle_path, "w", encoding="utf-8") as f:
                  f.write(gradle)
          EOF

      - name: Firmar y compilar Android App Bundle (AAB)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew

          KS_PASS="${KEYSTORE_PASSWORD:-MiCuadrante2026!}"
          K_ALIAS="${KEY_ALIAS:-micuadrante}"
          K_PASS="${KEY_PASSWORD:-MiCuadrante2026!}"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | tr -d ' \n\r\t' | base64 --decode > app/release.keystore
          else
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias "$K_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$K_PASS" \
              -dname "CN=K4NT3R0, OU=Apps, O=K4NT3R0, L=Cadiz, ST=Andalucia, C=ES"
          fi

          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/release.keystore \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$K_ALIAS" \
            -Pandroid.injected.signing.key.password="$K_PASS"

      - name: Subir archivo AAB listo para Google Play
        uses: actions/upload-artifact@v4
        with:
          name: MiCuadrante-AAB
          path: android/app/build/outputs/bundle/release/*.aab
